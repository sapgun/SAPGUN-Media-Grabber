name: Linux x64 v0.3.0 Alpha

on:
  push:
    branches:
      - feature/cross-platform-v0.3.0
    paths:
      - 'crossplatform/**'
      - '.github/workflows/linux-v0.3.0-alpha.yml'
  pull_request:
    paths:
      - 'crossplatform/**'
      - '.github/workflows/linux-v0.3.0-alpha.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install GUI smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xz-utils

      - name: Restore
        run: |
          dotnet restore crossplatform/SAPGUN.MediaGrabber/SAPGUN.MediaGrabber.csproj
          dotnet restore crossplatform/SAPGUN.MediaGrabber.Tests/SAPGUN.MediaGrabber.Tests.csproj

      - name: Build
        run: dotnet build crossplatform/SAPGUN.MediaGrabber/SAPGUN.MediaGrabber.csproj -c Release --no-restore

      - name: Test app-update logic
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet test crossplatform/SAPGUN.MediaGrabber.Tests/SAPGUN.MediaGrabber.Tests.csproj -c Release --no-restore

      - name: Resolve app version
        run: |
          APP_VERSION=$(dotnet msbuild crossplatform/SAPGUN.MediaGrabber/SAPGUN.MediaGrabber.csproj -getProperty:Version -nologo | tr -d '[:space:]')
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Resolved APP_VERSION=$APP_VERSION"

      - name: Publish self-contained linux-x64 app
        run: |
          dotnet publish crossplatform/SAPGUN.MediaGrabber/SAPGUN.MediaGrabber.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=false \
            -p:PublishTrimmed=false \
            -o dist/linux-x64/app

      - name: Bundle latest yt-dlp for Linux
        run: |
          mkdir -p dist/linux-x64/app/tools
          curl -fL --retry 3 \
            https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_linux \
            -o dist/linux-x64/app/tools/yt-dlp
          chmod +x dist/linux-x64/app/tools/yt-dlp
          dist/linux-x64/app/tools/yt-dlp --version

      - name: Bundle static FFmpeg + ffprobe for Linux
        run: |
          curl -fL --retry 3 \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            -o /tmp/ffmpeg.tar.xz
          mkdir -p /tmp/ffmpeg-bundle
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-bundle
          FFMPEG=$(find /tmp/ffmpeg-bundle -type f -path '*/bin/ffmpeg' | head -n 1)
          FFPROBE=$(find /tmp/ffmpeg-bundle -type f -path '*/bin/ffprobe' | head -n 1)
          test -n "$FFMPEG"
          test -n "$FFPROBE"
          cp "$FFMPEG" dist/linux-x64/app/tools/ffmpeg
          cp "$FFPROBE" dist/linux-x64/app/tools/ffprobe
          chmod +x dist/linux-x64/app/tools/ffmpeg dist/linux-x64/app/tools/ffprobe
          dist/linux-x64/app/tools/ffmpeg -version | head -n 1
          dist/linux-x64/app/tools/ffprobe -version | head -n 1

      - name: Add Linux launcher, desktop files and README
        run: |
          cp crossplatform/packaging/linux/sapgun-media-grabber dist/linux-x64/app/sapgun-media-grabber
          cp crossplatform/packaging/linux/install-desktop.sh dist/linux-x64/app/install-desktop.sh
          cp crossplatform/packaging/linux/sapgun-media-grabber.desktop dist/linux-x64/app/sapgun-media-grabber.desktop
          cp crossplatform/packaging/linux/sapgun-media-grabber.svg dist/linux-x64/app/sapgun-media-grabber.svg
          chmod +x dist/linux-x64/app/sapgun-media-grabber dist/linux-x64/app/install-desktop.sh

          cat > dist/linux-x64/app/README-LINUX.txt <<EOF
          SAPGUN Media Grabber v${APP_VERSION} — Linux x64

          Run:
            ./sapgun-media-grabber

          Optional desktop launcher:
            ./install-desktop.sh

          This writes a .desktop file into ~/.local/share/applications that points
          at this extracted folder. Re-run it if you move the folder.

          This build is self-contained and bundles yt-dlp, FFmpeg and ffprobe.
          No system Python, yt-dlp, FFmpeg or .NET installation is required.

          X / Twitter 1080p mode outputs an upload-friendly H.264 + AAC MP4.

          Feedback: https://x.com/caro7370
          Support:  https://ko-fi.com/sapgun
          Source:   https://github.com/sapgun/SAPGUN-Media-Grabber
          EOF
          sed -i 's/^          //' dist/linux-x64/app/README-LINUX.txt

      - name: Verify bundled files
        run: |
          test -x 'dist/linux-x64/app/SAPGUN Media Grabber'
          test -x dist/linux-x64/app/sapgun-media-grabber
          test -x dist/linux-x64/app/install-desktop.sh
          test -f dist/linux-x64/app/sapgun-media-grabber.desktop
          test -f dist/linux-x64/app/sapgun-media-grabber.svg
          grep -q 'Exec="@EXEC@"' dist/linux-x64/app/sapgun-media-grabber.desktop
          HOME=/tmp/sapgun-desktop-smoke \
            dist/linux-x64/app/install-desktop.sh
          grep -F "$(pwd)/dist/linux-x64/app/sapgun-media-grabber" \
            /tmp/sapgun-desktop-smoke/.local/share/applications/sapgun-media-grabber.desktop
          dist/linux-x64/app/tools/ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264
          dist/linux-x64/app/tools/ffmpeg -hide_banner -encoders 2>/dev/null | grep -Eq '(^| )A.*aac|aac'
          test -x dist/linux-x64/app/tools/yt-dlp
          test -x dist/linux-x64/app/tools/ffmpeg
          test -x dist/linux-x64/app/tools/ffprobe

      - name: X-ready MP4 codec smoke test
        run: |
          TOOLS=dist/linux-x64/app/tools
          "$TOOLS/ffmpeg" -y -hide_banner -loglevel error \
            -f lavfi -i 'testsrc=size=1280x720:rate=30' \
            -f lavfi -i 'sine=frequency=1000:sample_rate=48000' \
            -t 3 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/source.mp4

          "$TOOLS/ffmpeg" -y -hide_banner -loglevel error -i /tmp/source.mp4 \
            -map 0:v:0 -map '0:a:0?' \
            -c:v libx264 -preset medium -profile:v high -level 4.1 \
            -pix_fmt yuv420p -vf "scale='min(1920,iw)':-2:force_original_aspect_ratio=decrease" \
            -fpsmax 30 -crf 20 -maxrate 8M -bufsize 16M \
            -c:a aac -b:a 192k -ar 48000 -ac 2 -movflags +faststart \
            /tmp/x-ready.mp4

          VCODEC=$("$TOOLS/ffprobe" -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/x-ready.mp4)
          PIXFMT=$("$TOOLS/ffprobe" -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 /tmp/x-ready.mp4)
          ACODEC=$("$TOOLS/ffprobe" -v error -select_streams a:0 -show_entries stream=codec_name -of default=nw=1:nk=1 /tmp/x-ready.mp4)
          echo "video=$VCODEC pix_fmt=$PIXFMT audio=$ACODEC"
          test "$VCODEC" = "h264"
          test "$PIXFMT" = "yuv420p"
          test "$ACODEC" = "aac"

      - name: GUI launch smoke test under Xvfb
        run: |
          set +e
          xvfb-run -a timeout 8s dist/linux-x64/app/sapgun-media-grabber
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ] && [ "$CODE" -ne 124 ]; then
            echo "GUI launch failed with exit code $CODE"
            exit "$CODE"
          fi
          echo "GUI process launched successfully under Xvfb."

      - name: Package Linux x64 tarball
        run: |
          tar -C dist/linux-x64 -czf dist/SAPGUN-Media-Grabber-v${APP_VERSION}-linux-x64.tar.gz app
          sha256sum dist/SAPGUN-Media-Grabber-v${APP_VERSION}-linux-x64.tar.gz | tee dist/SHA256SUMS-linux-x64.txt

      - name: Upload Linux alpha artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAPGUN-Media-Grabber-linux-x64-alpha
          path: |
            dist/SAPGUN-Media-Grabber-v${{ env.APP_VERSION }}-linux-x64.tar.gz
            dist/SHA256SUMS-linux-x64.txt
          if-no-files-found: error
